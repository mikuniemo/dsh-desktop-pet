  <!-- eyes -->
  <ellipse cx="25" cy="32" rx="3.4" ry="4" fill="#4B342A"/>
  <ellipse cx="39" cy="32" rx="3.4" ry="4" fill="#4B342A"/>
  <circle cx="23.8" cy="30.4" r="1.1" fill="#FFFDF8"/>
