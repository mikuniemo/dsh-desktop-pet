  <rect x="2" y="2" width="60" height="60" rx="16" fill="#FDF3E4"/>
  <!-- ears -->
  <path d="M14 26 L16 10 L28 20 Z" fill="#E89034"/>
  <path d="M50 26 L48 10 L36 20 Z" fill="#E89034"/>
